[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "windowwheel"
dynamic = ["version"]
description = "Arrange macOS windows into predefined layouts with a radial menu"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = ["Operating System :: MacOS :: MacOS X", "Environment :: MacOS X :: Cocoa"]
dependencies = [
    "pyobjc-core>=12.0",
    "pyobjc-framework-Cocoa>=12.0",
    "pyobjc-framework-Quartz>=12.0",
    "pyobjc-framework-ApplicationServices>=12.0",
    "pyobjc-framework-ScreenCaptureKit>=12.0",
    "pyobjc-framework-CoreMedia>=12.0",
    "pyobjc-framework-libdispatch>=12.0",
]

[project.urls]
Homepage = "https://github.com/limburgmoritz-gh/windowwheel"

[project.scripts]
windowwheel = "windowwheel.app:main"

[tool.setuptools]
packages = ["windowwheel"]

[tool.setuptools.package-data]
windowwheel = ["resources/*.icns"]

[tool.setuptools.dynamic]
version = { attr = "windowwheel.__version__" }
